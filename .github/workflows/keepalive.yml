name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          # TODO: replace <your-app-name> with your actual Render app name, e.g. doikita
          curl -sS -o /dev/null -w "health status: %{http_code}\n" \
            https://<your-app-name>.onrender.com/health
